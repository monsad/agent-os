name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (whole project, incl. tests)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (production build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
